[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # same major Node version as local development
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cache built assets for a year (file names contain a content hash)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
